<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Go Chat</title>
    <style>
      :root {
        --bg: #e9eef2;
        --panel: #ffffff;
        --ink: #17222c;
        --muted: #6b7a88;
        --line: #d5dde4;
        --mine: #1c5d8a;
        --mine-ink: #ffffff;
        --accent: #1c5d8a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10181f;
          --panel: #19242e;
          --ink: #e6edf3;
          --muted: #8a9aa8;
          --line: #2b3945;
          --mine: #2f7db3;
          --mine-ink: #ffffff;
          --accent: #5aa8d8;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        justify-content: center;
      }
      .app {
        width: 100%;
        max-width: 640px;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      header h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 650;
      }
      #status {
        font-size: 0.85rem;
        color: var(--muted);
      }
      #status.on::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3aa76d;
        margin-right: 6px;
      }
      #status.off::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c8553d;
        margin-right: 6px;
      }

      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .msg {
        max-width: 80%;
        padding: 8px 12px;
        border-radius: 14px;
        background: var(--bg);
        overflow-wrap: anywhere;
      }
      .msg .who {
        font-size: 0.78rem;
        font-weight: 650;
        color: var(--accent);
      }
      .msg .time {
        font-size: 0.72rem;
        color: var(--muted);
        margin-left: 6px;
        font-weight: 400;
      }
      .msg.mine {
        align-self: flex-end;
        background: var(--mine);
        color: var(--mine-ink);
      }
      .msg.mine .who,
      .msg.mine .time {
        color: rgba(255, 255, 255, 0.8);
      }
      .sys {
        align-self: center;
        font-size: 0.82rem;
        color: var(--muted);
        padding: 2px 0;
      }

      form.send {
        display: flex;
        gap: 8px;
        padding: 12px 14px;
        border-top: 1px solid var(--line);
      }
      input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      button {
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        background: var(--mine);
        border: 0;
        border-radius: 10px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      #login {
        margin: auto;
        padding: 24px;
        width: 100%;
        max-width: 360px;
      }
      #login h2 {
        margin: 0 0 4px;
        font-size: 1.3rem;
      }
      #login p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      #login form {
        display: flex;
        gap: 8px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div id="login">
        <h2>Entrar al chat</h2>
        <p>Elige un nombre para que los demás te reconozcan.</p>
        <form id="loginForm">
          <input
            type="text"
            id="name"
            maxlength="20"
            placeholder="Tu nombre"
            autocomplete="nickname"
            required
          />
          <button type="submit">Entrar</button>
        </form>
      </div>

      <header class="hidden" id="head">
        <h1>Go Chat</h1>
        <span id="status" class="off">desconectado</span>
      </header>
      <div id="log" class="hidden" aria-live="polite"></div>
      <form class="send hidden" id="sendForm">
        <input
          type="text"
          id="text"
          maxlength="500"
          placeholder="Escribe un mensaje"
          autocomplete="off"
        />
        <button type="submit" id="sendBtn" disabled>Enviar</button>
      </form>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let ws,
        myName = "";

      // Al pulsar submit oculta la ventana de inicio y muestra la de chat
      $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        myName = $("name").value.trim();
        if (!myName) return;
        $("login").classList.add("hidden");
        ["head", "log", "sendForm"].forEach((id) =>
          $(id).classList.remove("hidden"),
        );
        connect();
        $("text").focus();
      });

      function connect() {
        //Si la página se sirve por HTTPS hay que usar wss:// (WebSocket seguro); si no, ws://
        const proto = location.protocol === "https:" ? "wss" : "ws";
        //Crear websocket
        // location.host es el servidor desde el que se cargó la página (localhost:8080), así no hay que escribirlo a mano
        //encodeURIComponent codifica el nombre para que caracteres como espacios o tildes no rompan la URL.
        ws = new WebSocket(
          `${proto}://${location.host}/ws?name=${encodeURIComponent(myName)}`,
        );

        //se abre la conexión
        ws.onopen = () => setStatus(true);
        //Si se cierra la conexión, y se marca como desconectado, se muestra un aviso y, 
        // con setTimeout(connect, 2000), se reintenta a los 2 segundos. 
        ws.onclose = () => {
          setStatus(false);
          addSystem("Conexión perdida. Reintentando…");
          setTimeout(connect, 2000);
        };
        // Si llega un mensaje del servidor, guarda el mensaje en un JSON.
        ws.onmessage = (e) => {
          const m = JSON.parse(e.data);
          // Si alguien entró o salió (system), se pinta como aviso, si no como chat
          if (m.type === "system") addSystem(m.text);
          else addChat(m);
        };
      }

      //Cambia la clase del indicador (el CSS pinta el punto verde o rojo), 
      //el texto, y activa o desactiva el botón Enviar según haya conexión.
      function setStatus(on) {
        const s = $("status");
        s.className = on ? "on" : "off";
        s.textContent = on ? "conectado" : "desconectado";
        $("sendBtn").disabled = !on;
      }

      // Se lee el texto y se descarta si está vacío o si la conexión no está abierta.
      // Si todo está bien, ws.send envía el mensaje (eso lo lee el ReadJSON de readPump en Go) 
      // y se vacía la caja. 
      $("sendForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const text = $("text").value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ text }));
        $("text").value = "";
      });

      //Pintar un mensaje de chat (construye el elemento pieza por pieza)
      function addChat(m) {
        const div = document.createElement("div");
        div.className = "msg" + (m.from === myName ? " mine" : "");

        const who = document.createElement("div");
        who.className = "who";
        who.textContent = m.from;
        const time = document.createElement("span");
        time.className = "time";
        time.textContent = new Date(m.time).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        who.appendChild(time);

        const body = document.createElement("div");
        body.textContent = m.text; // textContent evita inyección de HTML

        div.append(who, body);
        push(div);
      }

      function addSystem(text) {
        const div = document.createElement("div");
        div.className = "sys";
        div.textContent = text;
        push(div);
      }

      // Antes de añadir el mensaje, calcula si estás cerca del final de 
      // la lista (a menos de 80 píxeles). Si es así, tras añadirlo baja el scroll hasta el final.
      // Si estás leyendo mensajes antiguos más arriba, no te mueve, para que no pierdas el sitio.
      function push(node) {
        const log = $("log");
        const nearBottom =
          log.scrollHeight - log.scrollTop - log.clientHeight < 80;
        log.appendChild(node);
        if (nearBottom) log.scrollTop = log.scrollHeight;
      }
    </script>
  </body>
</html>
